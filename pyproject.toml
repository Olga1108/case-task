[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipedia-interest"
version = "0.1.0"
description = "Skeleton for a Wikipedia pageview interest analysis skill"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wikipedia-interest = "wikipedia_interest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
